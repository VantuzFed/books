services:
  mariadb:
    image: mariadb:11.4
    container_name: books_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: books_db
      MARIADB_USER: books_user
      MARIADB_PASSWORD: books_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
